<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>과자 몰래먹기 :: 2027 강차 시즌그리팅</title>
    
    <!-- 폰트 로드: Noto Serif KR (본명조), Cinzel (영문 타이틀)[cite: 3] -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- DSEG 공식 CDN 스타일시트 로드[cite: 5] -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dseg@0.46.0/css/dseg.css">

    <style>
        /* DSEG7 슬림한 Regular 폰트 정의[cite: 5] */
        @font-face {
            font-family: 'DSEG7-Classic';
            src: url('https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG7-Classic/DSEG7Classic-Regular.woff2') format('woff2'),
                 url('https://unpkg.com/dseg@0.46.0/fonts/DSEG7-Classic/DSEG7Classic-Regular.woff2') format('woff2'),
                 url('https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG7-Classic/DSEG7Classic-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* 🌟 모든 이미지의 기본 인라인 여백 및 틈새 제거[cite: 5] */
        img {
            display: block;
            vertical-align: top;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #121212;
            font-family: 'Noto Serif KR', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            cursor: url('cursor_default.png') 0 0, auto;
        }

        /* 🌟 1800x1080 고정 비율 래퍼[cite: 5] */
        #game-wrapper {
            position: relative;
            width: 1800px;
            height: 1080px;
            flex-shrink: 0;
            overflow: hidden;
            background-color: #1a1918;
            transform-origin: center center;
            box-shadow: 0 15px 50px rgba(0,0,0,0.7);
            cursor: url('cursor_default.png') 0 0, auto;
        }

        /* 🌟 클릭 가능한 요소 손가락 커서[cite: 5] */
        button, 
        a, 
        .close-icon, 
        .img-btn,
        .btn-main-dark,
        .topbar-link,
        #screen-game {
            cursor: url('cursor_pointer.png') 4 0, pointer !important;
        }

        /* 🌟 이미지 버튼 공통 효과 (클릭 시 쫀득한 눌림 효과) */
        .img-btn {
            user-select: none;
            -webkit-user-drag: none;
            transition: transform 0.08s ease;
            filter: drop-shadow(0px 3px 5px rgba(0, 0, 0, 0.5)); /* 🌟 이미지 외곽선을 따라가는 그림자 추가 */
            /* 0px: 그림자의 가로 위치 (양수면 오른쪽, 음수면 왼쪽)
            3px: 그림자의 세로 위치 (양수면 아래, 음수면 위)
            5px: 그림자의 번짐 정도 (숫자가 클수록 부드럽게 퍼짐)
            0.5: 그림자의 진하기 (0.1 ~ 1.0 사이, 높을수록 진해짐) */
        }

        .img-btn:active {
            transform: scale(0.96);
        }

        #input-id {
            cursor: text !important;
        }

        /* 🌟 상단바 (높이 84px)[cite: 5] */
        #top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 84px;
            background-image: url('topbar_bg.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 45px;
            z-index: 100;
        }

        .topbar-link {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        #topbar-title-img {
            height: 26px;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
        }

        #topbar-x-img {
            height: 27px;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* 화면 레이아웃[cite: 5] */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 1800px;
            height: 1080px;
            display: none;
        }

        /* =========================================
           1. 대문 화면 (1800x1080 1:1 고정)[cite: 5]
           ========================================= */
        #screen-start {
            display: flex;
            background-image: url('main_bg.png');
            background-size: 100% 100%;
            background-position: center;
            justify-content: center;
            align-items: center;
        }

        /* 🌟 이미지 버튼 배치 박스 */
        .main-menu-box {
            position: absolute;
            bottom: 160px; /* 포토샵 시안 종이 하단 위치에 맞춤 */
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        /* =========================================
           팝업 공통[cite: 5]
           ========================================= */
        .popup-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 1800px;
            height: 1080px;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(4px);
            z-index: 150;
            justify-content: center;
            align-items: center;
        }

        /* 🌟 1-1. 게임 설명 팝업 (이미지 전용 컨테이너) */
        #popup-desc-container {
            position: relative;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin-top: 80px;
        }

        #desc-popup-img {
            max-width: 1300px;
            height: auto;
            user-select: none;
            -webkit-user-drag: none;
            box-shadow: 0 20px 50px rgba(0,0,0,0.35);
        }

        /* 게임 설명 닫기 버튼 위치 (이미지 하단 중앙) */
        #btn-close-desc {
            position: absolute;
            bottom: 45px;
            left: 50%;
            transform: translateX(-50%);
        }

        #btn-close-desc:active {
            transform: translateX(-50%) scale(0.96);
        }

        /* 🌟 아이디 입력 팝업 박스 (이미지 배경 적용) */
        #popup-id-card {
            position: relative;
            width: 900px;
            height: auto;
            background-image: url('id_popup_box.png'); /* 아이디 입력창 박스 이미지 */
            background-size: 100% 100%;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 50px 45px 50px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.35);
        }

        /* 1. 타이틀 이미지 크기 */
        #id-title-img {
            max-width: 260px;
            height: auto;
            margin-bottom: 15px;
        }

        /* 2. 안내 문구 이미지 크기 */
        #id-instruction-img {
            max-width: 600px;
            height: auto;
            margin-bottom: 25px;
        }

        /* 3. 아이디 입력창 테두리 박스 (가운데 정렬) */
        .input-box-wrapper {
            width: 680px;
            border: 3px solid #b59b71;
            border-radius: 0px; /* 박스 라운드 */
            padding: 12px 25px;
            margin-bottom: 18px;
            background: #ffffff;
        }

        #input-id {
            width: 100%;
            border: none;
            outline: none;
            font-family: 'Noto Serif KR', serif;
            font-size: 34px;
            text-align: center;
            color: #242220;
            background: transparent;
        }

        /* 4. 경고 문구 이미지 (공간을 유지한 채 숨겨둠) */
        #id-warning-img {
            height: 24px; /* 경고 이미지 높이에 맞게 조절 */
            object-fit: contain;
            margin-top: 7px;
            margin-bottom: 18px;
            visibility: hidden; /* 오류 전에는 공간만 차지하고 보이지 않음 */
        }

        .btn-main-dark {
            width: 310px;
            height: 74px;
            background: linear-gradient(180deg, #33312e 0%, #1e1d1b 100%);
            border: 3px solid #a68c6d;
            border-radius: 12px;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
            transition: transform 0.05s ease;
        }

        .btn-main-dark:active {
            transform: scale(0.96);
        }

        .btn-main-dark .btn-text {
            font-size: 27px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-subtext {
            font-size: 13px;
            letter-spacing: 1px;
            opacity: 0.8;
            margin-top: 2px;
        }

        /* =========================================
           2. 게임 화면[cite: 5]
           ========================================= */
        #screen-game {
            background-color: #d8cfc4;
            position: relative;
            touch-action: none;
        }

        #game-bg-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: url('game_bg.png');
            background-size: cover;
            background-position: center;
            pointer-events: none;
        }

        #door-layer {
            position: absolute;
            top: 30px;
            left: 295px;
            width: 360px;
            height: 720px;
            pointer-events: none;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: bottom center;
        }

        .door-closed { background-image: url('door_closed.png'); }
        .juhan-open { background-image: url('juhan_open.png'); }
        .juhan-scold { background-image: url('juhan_scold.png'); }

        #minjae-character {
            position: absolute;
            bottom: 0;
            right: 240px;
            width: 700px;
            height: 700px;
            pointer-events: none;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: bottom right;
        }

        .minjae-idle { background-image: url('minjae_idle.png'); }
        .minjae-eat1 { background-image: url('minjae_eat1.png'); }
        .minjae-eat2 { background-image: url('minjae_eat2.png'); }
        .minjae-shock { background-image: url('minjae_shock.png'); }

        #score-board-box {
            position: absolute;
            top: 35px;
            right: 320px;
            background: #ffffff;
            border-radius: 16px;
            border: 3px solid #b8b1a8;
            padding: 10px 45px 6px 45px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        #score-board-box .score-label {
            font-size: 17px;
            color: #8c827a;
            font-family: sans-serif;
            font-weight: 600;
        }

        #score-display {
            font-family: 'DSEG7-Classic', monospace;
            font-weight: normal;
            font-size: 60px;
            color: #111111;
            letter-spacing: 5px;
            margin-top: 3px;
        }

        /* =========================================
           3. 게임 오버 화면[cite: 5]
           ========================================= */
        #screen-gameover {
            position: absolute;
            top: 0;
            left: 0;
            width: 1800px;
            height: 1080px;
            background: linear-gradient(rgba(0, 0, 0, 0.72), rgba(0, 0, 0, 0.72)), url('juhan_closeup.png');
            background-size: cover;
            background-position: center;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 300;
        }

        #gameover-title {
            font-family: 'Cinzel', serif;
            font-size: 135px;
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 6px;
            margin: 0;
            text-shadow: 0 0 30px rgba(255,255,255,0.25);
        }

        #gameover-id {
            font-family: 'Noto Serif KR', serif;
            font-size: 45px;
            color: #ffffff;
            margin-top: 20px;
            margin-bottom: 15px;
        }

        #gameover-score-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 55px;
        }

        #gameover-score-label {
            font-size: 20px;
            color: #999;
            margin-bottom: 3px;
        }

        #gameover-score {
            font-family: 'DSEG7-Classic', monospace;
            font-weight: normal;
            font-size: 82px;
            color: #ffffff;
            letter-spacing: 7px;
        }

        .gameover-btn-group {
            display: flex;
            gap: 35px;
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <!-- 상단바[cite: 5] -->
        <div id="top-bar">
            <a href="https://x.com/1201x0617_SG" target="_blank" rel="noopener noreferrer" class="topbar-link">
                <img src="topbar_title.png" id="topbar-title-img" alt="정도 웰컴 키트 :: 2027 강차 시즌그리팅">
            </a>
            <a href="https://x.com/1201x0617_SG" target="_blank" rel="noopener noreferrer" class="topbar-link">
                <img src="topbar_x.png" id="topbar-x-img" alt="X 로고">
            </a>
        </div>

        <!-- 1. 대문 화면 (이미지 버튼 2개 적용) -->
        <div id="screen-start" class="screen">
            <div class="main-menu-box">
                <img src="btn_start.png" id="btn-open-start-popup" class="img-btn" alt="게임 시작">
                <img src="btn_desc.png" id="btn-open-desc-popup" class="img-btn" alt="게임 설명">
            </div>
        </div>

        <!-- 1-1. 게임 설명 팝업 (이미지 및 닫기 버튼 이미지 적용) -->
        <div id="popup-desc" class="popup-overlay">
            <div id="popup-desc-container">
                <img src="desc_popup.png" id="desc-popup-img" alt="게임 설명">
                <img src="btn_close.png" id="btn-close-desc" class="img-btn" alt="닫기">
            </div>
        </div>

        <!-- 1-2. 아이디 입력 팝업 -->
        <div id="popup-id" class="popup-overlay">
            <div class="popup-card" id="popup-id-card">
                <!-- 1. '아이디 입력' 타이틀 이미지 -->
                <img src="id_title.png" id="id-title-img" alt="아이디 입력">

                <!-- 2. 안내 문구 이미지 -->
                <img src="id_instruction.png" id="id-instruction-img" alt="트위터 아이디 안내 문구">

                <!-- 3. 실제 타이핑하는 아이디 입력칸 -->
                <div class="input-box-wrapper">
                    <input type="text" id="input-id" placeholder="@아이디" autocomplete="off" spellcheck="false">
                </div>

                <!-- 4. 경고 문구 이미지 (경고1, 경고2가 상황에 맞춰 교체됨) -->
                <img src="id_warn_empty.png" id="id-warning-img" alt="경고 문구">

                <!-- 5. 게임 시작 버튼 이미지 (대문과 동일) -->
                <img src="btn_start.png" id="btn-confirm-id" class="img-btn" alt="게임 시작">
            </div>
        </div>

        <!-- 2. 게임 플레이 화면[cite: 5] -->
        <div id="screen-game" class="screen">
            <div id="game-bg-layer"></div>
            
            <div id="door-layer" class="door-closed"></div>
            <div id="minjae-character" class="minjae-idle"></div>

            <div id="score-board-box">
                <div class="score-label">Score</div>
                <div id="score-display">0</div>
            </div>
        </div>

        <!-- 3. 게임 오버 화면[cite: 5] -->
        <div id="screen-gameover">
            <h1 id="gameover-title">GAME OVER</h1>
            <div id="gameover-id">@아이디</div>
            
            <div id="gameover-score-wrap">
                <span id="gameover-score-label">Score</span>
                <span id="gameover-score">0</span>
            </div>

            <div class="gameover-btn-group">
                <button id="btn-share" class="btn-main-dark">
                    <div class="btn-text">𝕏 공유하기</div>
                    <div class="btn-subtext">Share</div>
                </button>
                <button id="btn-restart" class="btn-main-dark">
                    <div class="btn-text">↺ 처음으로</div>
                    <div class="btn-subtext">GAME START</div>
                </button>
            </div>
        </div>
    </div>

    <script>
        /* 1800x1080 비율 자동 스케일[cite: 5] */
        function resizeGame() {
            const wrapper = document.getElementById('game-wrapper');
            const scale = Math.min(window.innerWidth / 1800, window.innerHeight / 1080);
            wrapper.style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', resizeGame);
        resizeGame();

        /* 🌟 전체 이미지 사전 로딩 (버튼 및 설명 팝업 포함) */
        const preloadImageSources = [
            'btn_start.png',
            'btn_desc.png',
            'desc_popup.png',
            'btn_close.png',
            'id_popup_box.png',
            'id_title.png',
            'id_instruction.png',
            'id_warn_empty.png',
            'id_warn_format.png',
            'door_closed.png',
            'juhan_open.png',
            'juhan_scold.png',
            'juhan_closeup.png',
            'minjae_idle.png',
            'minjae_eat1.png',
            'minjae_eat2.png',
            'minjae_shock.png'
        ];

        preloadImageSources.forEach((src) => {
            const img = new Image();
            img.src = src;
        });

        const screenStart = document.getElementById('screen-start');
        const screenGame = document.getElementById('screen-game');
        const screenGameOver = document.getElementById('screen-gameover');

        const popupDesc = document.getElementById('popup-desc');
        const popupId = document.getElementById('popup-id');
        const inputId = document.getElementById('input-id');
        
        // 🌟 경고 이미지 요소 선택
        const idWarningImg = document.getElementById('id-warning-img');

        // 실시간 입력 시 경고 숨김
        inputId.addEventListener('input', (e) => {
            let val = e.target.value.replace(/[^@a-zA-Z0-9_]/g, '');
            let atCount = 0;
            val = val.replace(/@/g, () => (++atCount === 1 ? '@' : ''));
            if (val.length > 20) val = val.slice(0, 20);
            e.target.value = val;
            
            if (val.length > 0) {
                idWarningImg.style.visibility = 'hidden';
            }
        });

        // '게임 시작' 버튼 클릭 검증 로직
        document.getElementById('btn-confirm-id').addEventListener('click', () => {
            userTwitterId = inputId.value.trim();
            const rawId = userTwitterId.replace(/^@/, '');

            // 🚨 1. 빈칸인 경우 -> 경고문구 1 표시
            if (userTwitterId === "") {
                idWarningImg.src = 'id_warn_empty.png';
                idWarningImg.style.visibility = 'visible';
                inputId.focus();
                return;
            }

            // 🚨 2. @로 시작하지 않는 경우 -> 경고문구 2 표시
            if (!userTwitterId.startsWith('@')) {
                idWarningImg.src = 'id_warn_format.png';
                idWarningImg.style.visibility = 'visible';
                inputId.focus();
                return;
            }

            // 🚨 3. @만 있거나 아이디가 3글자 미만인 경우 -> 경고문구 1 표시
            if (rawId.length < 3) {
                idWarningImg.src = 'id_warn_empty.png';
                idWarningImg.style.visibility = 'visible';
                inputId.focus();
                return;
            }

            // 정상 통과 시 게임 화면 진입
            popupId.style.display = 'none';
            screenStart.style.display = 'none';
            screenGame.style.display = 'block';

            startGame();
        });

        const doorLayer = document.getElementById('door-layer');
        const minjaeChar = document.getElementById('minjae-character');
        const scoreDisplay = document.getElementById('score-display');
        const gameoverId = document.getElementById('gameover-id');
        const gameoverScore = document.getElementById('gameover-score');

        let userTwitterId = '';
        let score = 0;
        let isGameRunning = false;
        let isEating = false;
        
        let scoreInterval = null;
        let eatAnimInterval = null;
        let bossCycleTimeout = null;

        let doorState = 'closed';
        let eatFrame = 1;

        // 설명 팝업 열기 / 닫기
        document.getElementById('btn-open-desc-popup').addEventListener('click', () => {
            popupDesc.style.display = 'flex';
        });
        document.getElementById('btn-close-desc').addEventListener('click', () => {
            popupDesc.style.display = 'none';
        });

        // 아이디 팝업 열기[cite: 5]
        document.getElementById('btn-open-start-popup').addEventListener('click', () => {
            popupId.style.display = 'flex';
            inputId.focus();
        });

        inputId.addEventListener('input', (e) => {
            let val = e.target.value.replace(/[^@a-zA-Z0-9_]/g, '');
            let atCount = 0;
            val = val.replace(/@/g, () => (++atCount === 1 ? '@' : ''));
            if (val.length > 20) val = val.slice(0, 20);
            e.target.value = val;
            if (val.length > 0) idWarning.style.visibility = 'hidden';
        });

        document.getElementById('btn-confirm-id').addEventListener('click', () => {
            userTwitterId = inputId.value.trim();
            const rawId = userTwitterId.replace(/^@/, '');

            if (userTwitterId === "") {
                idWarning.textContent = "아이디를 입력해 주세요.";
                idWarning.style.visibility = 'visible';
                inputId.focus();
                return;
            }

            if (!userTwitterId.startsWith('@')) {
                idWarning.textContent = "아이디는 '@아이디'형태로 입력해 주세요.";
                idWarning.style.visibility = 'visible';
                inputId.focus();
                return;
            }

            if (rawId.length < 3) {
                idWarning.textContent = "아이디를 입력해 주세요.";
                idWarning.style.visibility = 'visible';
                inputId.focus();
                return;
            }

            popupId.style.display = 'none';
            screenStart.style.display = 'none';
            screenGame.style.display = 'block';

            startGame();
        });

        inputId.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('btn-confirm-id').click();
        });

        /* 과자 먹기 모션[cite: 5] */
        function startEating(e) {
            if (!isGameRunning || isEating) return;
            if (e) e.preventDefault();
            
            isEating = true;

            if (doorState === 'open') {
                triggerCaughtGameOver();
                return;
            }

            eatFrame = 1;
            minjaeChar.className = 'minjae-eat1';

            eatAnimInterval = setInterval(() => {
                eatFrame = (eatFrame === 1) ? 2 : 1;
                minjaeChar.className = (eatFrame === 1) ? 'minjae-eat1' : 'minjae-eat2';
            }, 160);
        }

        function stopEating(e) {
            if (!isGameRunning || !isEating) return;
            if (e) e.preventDefault();

            isEating = false;
            clearInterval(eatAnimInterval);
            minjaeChar.className = 'minjae-idle';
        }

        screenGame.addEventListener('pointerdown', startEating);
        window.addEventListener('pointerup', stopEating);
        window.addEventListener('pointercancel', stopEating);

        /* 게임 진행 및 차주한 등장 패턴[cite: 5] */
        function startGame() {
            isGameRunning = true;
            isEating = false;
            score = 0;
            doorState = 'closed';
            
            doorLayer.className = 'door-closed';
            minjaeChar.className = 'minjae-idle';
            scoreDisplay.textContent = '0';

            scoreInterval = setInterval(() => {
                if (isEating && isGameRunning) {
                    score += 1;
                    scoreDisplay.textContent = score;
                }
            }, 50);

            scheduleNextBossVisit();
        }

        function scheduleNextBossVisit() {
            if (!isGameRunning) return;

            const waitTime = Math.random() * 2300 + 2200;

            bossCycleTimeout = setTimeout(() => {
                if (!isGameRunning) return;

                doorState = 'open';
                doorLayer.className = 'juhan-open';

                if (isEating) {
                    triggerCaughtGameOver();
                    return;
                }

                const stayDuration = Math.random() * 600 + 1200;
                bossCycleTimeout = setTimeout(() => {
                    if (!isGameRunning) return;

                    doorState = 'closed';
                    doorLayer.className = 'door-closed';

                    scheduleNextBossVisit();
                }, stayDuration);

            }, waitTime);
        }

        /* 검거 및 게임오버 전환[cite: 5] */
        function triggerCaughtGameOver() {
            isGameRunning = false;
            clearInterval(scoreInterval);
            clearInterval(eatAnimInterval);
            clearTimeout(bossCycleTimeout);

            minjaeChar.className = 'minjae-shock';
            doorLayer.className = 'juhan-scold';

            setTimeout(() => {
                gameoverId.textContent = userTwitterId;
                gameoverScore.textContent = score;
                screenGameOver.style.display = 'flex';
            }, 1000);
        }

        // 트위터 공유[cite: 5]
        document.getElementById('btn-share').addEventListener('click', () => {
            const shareText = `정도 웰컴 키트 :: 2027 강차 시즌그리팅\n과자 몰래먹기에서 ${score}점을 획득했습니다!\n아이디: ${userTwitterId}\n\n#정도_웰컴_키트 #2027_강차_시즌그리팅 #과자몰래먹기\n`;
            const currentUrl = window.location.origin + window.location.pathname + '?v=1';
            const twitterUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}&url=${encodeURIComponent(currentUrl)}`;
            window.open(twitterUrl, '_blank');
        });

        document.getElementById('btn-restart').addEventListener('click', () => {
            location.reload();
        });
    </script>
</body>
</html>
